<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Show</title>
  </head>
  <body>
    <h1>Add a New Show</h1>
    <form action="/shows/create" method="POST">
      {% csrf_token %}
      <label for="title">Title: <input type="text" name="title" id="title"/></label>
      <label for="network">Network: <input type="text" name="network" id="network"/></label>
      <label for="release_date">Release Date: <input type="date" name="release_date" id="release_date"/></label>
      <label for="description">Description: <input name="description" id="description"/></label>
      <button type="submit">Create</button>
    </form>

    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <a href="/shows">Go Back</a>
  </body>
</html>
