<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
  </head>
  <body class="d-flex flex-column align-content-center flex-wrap">
    <h1>All the Users:</h1>
    <table class="table table-bordered w-fit p-3 bg-white text-dark">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{user.id}}</td>
          <td>{{user.first_name}} {{user.last_name}}</td>
          <td>{{user.email}}</td>
          <td>{{user.age}}</td>
          <td>
            <form action="/remove/{{user.id}}/" method="post">
              {% csrf_token %}
              <input type="hidden" name="delete" value="{{user.id}}" />
              <button
                type="submit"
                value="delete"
                class="theme-danger btn-solid btn-styled btn-xs rounded-pill"
              >
                delete user
              </button>
            </form>

            <form action="/update/{{ user.id }}/" method="get">
              {% csrf_token %}
              <button
                type="submit"
                class="theme-warning btn-solid btn-styled btn-xs rounded-pill"
              >
                Update user
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <hr />
    <h1>Add a User:</h1>
    <form action="/add/" method="post">
      {% csrf_token %}
      <div>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <label for="first_name" class="form-label">First name:</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              class="form-control"
              style="width: 200px"
            />
          </div>
          <div>
            <label for="last_name" class="form-label">Last name:</label>
            <input
              type="text"
              id="last_name"
              name="last_name"
              class="form-control"
              style="width: 200px"
            />
          </div>
        </div>
        <div>
          <div>
            <label for="email" class="form-label">Email:</label>
            <input
              type="text"
              id="email"
              name="email"
              class="form-control"
              style="width: 200px"
            />
          </div>
          <div>
            <label for="age" class="form-label">Age:</label>
            <input
              type="text"
              id="age"
              class="form-control"
              name="age"
              style="width: 200px"
            />
          </div>
        </div>
      </div>
      <input type="submit" value="add" />
    </form>
  </body>
</html>
