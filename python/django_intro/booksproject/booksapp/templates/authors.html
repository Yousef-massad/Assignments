<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <div class="row">
            <div class="col-md-5 bg-white p-4 shadow rounded">
                <h3>Add an Author</h3>
                <form action="/authors/create" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
            <div class="col-md-7">
                <h3>All Authors</h3>
                <table class="table table-bordered bg-white shadow">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for author in authors %}
                        <tr>
                            <td>{{ author.first_name }} {{ author.last_name }}</td>
                            <td>
                                <a href="/authors/{{ author.id }}" class="btn btn-sm btn-info text-white">View</a>
                                <a href="/authors/{{ author.id }}/edit" class="btn btn-sm btn-warning">Edit</a>
                                <a href="/authors/{{ author.id }}/delete" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <a href="/" class="btn btn-secondary">Go to Books</a>
            </div>
        </div>
    </div>
</body>
</html>
