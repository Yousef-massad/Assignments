<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <div class="row">
            <div class="col-md-5 bg-white p-4 shadow rounded">
                <h3>Add a Book</h3>
                <form action="/books/create" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
            <div class="col-md-7">
                <h3>All Books</h3>
                <table class="table table-bordered bg-white shadow">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for book in books %}
                        <tr>
                            <td>{{ book.title }}</td>
                            <td>
                                <a href="/books/{{ book.id }}" class="btn btn-sm btn-info text-white">View</a>
                                <a href="/books/{{ book.id }}/edit" class="btn btn-sm btn-warning">Edit</a>
                                <a href="/books/{{ book.id }}/delete" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <a href="/authors" class="btn btn-secondary">Go to Authors</a>
            </div>
        </div>
    </div>
</body>
</html>
