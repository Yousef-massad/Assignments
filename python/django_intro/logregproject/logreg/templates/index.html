
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">Welcome!</h1>
            <p class="text-secondary">
                Create an account or log in to continue.
            </p>
        </div>

        {% if messages %}
            <div class="row justify-content-center mb-4">
                <div class="col-lg-8">
                    {% for message in messages %}
                        <div class="alert
                            {% if message.tags == 'error' %}
                                alert-danger
                            {% elif message.tags == 'success' %}
                                alert-success
                            {% else %}
                                alert-info
                            {% endif %}
                            alert-dismissible fade show"
                            role="alert">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close">
                            </button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}

        <div class="row justify-content-center g-4">

            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4 p-lg-5">

                        <h2 class="card-title text-center fw-bold mb-4">
                            Register
                        </h2>

                        <form action="/register" method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="first_name"
                                    class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="first_name"
                                    name="first_name"
                                    placeholder="Enter first name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="last_name"
                                    class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="last_name"
                                    name="last_name"
                                    placeholder="Enter last name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="register_email"
                                    class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="register_email"
                                    name="email"
                                    placeholder="name@example.com"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="register_password"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="register_password"
                                    name="password"
                                    placeholder="At least 8 characters"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password"
                                    class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm_password"
                                    name="confirm_password"
                                    placeholder="Repeat your password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100 py-2">
                                Create Account
                            </button>
                        </form>

                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4 p-lg-5">

                        <h2 class="card-title text-center fw-bold mb-4">
                            Login
                        </h2>

                        <p class="text-secondary text-center mb-4">
                            Welcome back! Enter your account details.
                        </p>

                        <form action="/login" method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="login_email"
                                    class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="login_email"
                                    name="email"
                                    placeholder="name@example.com"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="login_password"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="login_password"
                                    name="password"
                                    placeholder="Enter your password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-outline-primary w-100 py-2">
                                Log In
                            </button>
                        </form>

                    </div>
                </div>
            </div>

        </div>

        <footer class="text-center text-secondary mt-5">
            <small>Login & Registration System</small>
        </footer>
    </div>

</body>
</html>
