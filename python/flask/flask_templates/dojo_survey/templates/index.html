<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dojo Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4 bg-white">
            <h2 class="mb-4 text-center">Dojo Survey</h2>
            <form action="/result" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Your Name:</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dojo Location:</label>
                    <select name="location" class="form-select" required>
                        <option value="" disabled selected>Select Location</option>
                        <option value="San Jose">San Jose</option>
                        <option value="Seattle">Seattle</option>
                        <option value="Chicago">Chicago</option>
                        <option value="Online">Online</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Favorite Language:</label>
                    <select name="language" class="form-select" required>
                        <option value="" disabled selected>Select Language</option>
                        <option value="Python">Python</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="C#">C#</option>
                        <option value="Java">Java</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Hobbies (Check all that apply):</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="hobbies" id="coding" value="Coding">
                        <label class="form-check-label" for="coding">Coding</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="hobbies" id="gaming" value="Gaming">
                        <label class="form-check-label" for="gaming">Gaming</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="hobbies" id="reading" value="Reading">
                        <label class="form-check-label" for="reading">Reading</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Comment (Optional):</label>
                    <textarea name="comment" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-dark w-100">Submit Form</button>

            </form>
        </div>
    </div>

</body>
</html>
