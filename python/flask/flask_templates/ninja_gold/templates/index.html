<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ninja Gold</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .building-box {
            border: 1px solid #ced4da;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #fff;
            text-align: center;
        }
        .activities-box {
            border: 1px solid #ced4da;
            height: 200px;
            overflow-y: scroll;
            padding: 15px;
            background-color: #fff;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-4">
        <div class="d-flex align-items-center mb-4">
            <h4 class="me-3">Your Gold:</h4>
            <input type="text" class="form-control w-25 fw-bold fs-5 text-center" value="{{ session['gold'] }}" readonly>
            <a href="/reset" class="btn btn-outline-danger ms-auto">Reset Game</a>
        </div>

        <div class="row text-center">
            <div class="col-md-3">
                <div class="building-box">
                    <h3>Farm</h3>
                    <p class="text-muted">(earns 10-20 golds)</p>
                    <form action="/process_money" method="post">
                        <input type="hidden" name="building" value="farm">
                        <button type="submit" class="btn btn-primary">Find Gold!</button>
                    </form>
                </div>
            </div>

            <div class="col-md-3">
                <div class="building-box">
                    <h3>Cave</h3>
                    <p class="text-muted">(earns 5-10 golds)</p>
                    <form action="/process_money" method="post">
                        <input type="hidden" name="building" value="cave">
                        <button type="submit" class="btn btn-primary">Find Gold!</button>
                    </form>
                </div>
            </div>

            <div class="col-md-3">
                <div class="building-box">
                    <h3>House</h3>
                    <p class="text-muted">(earns 2-5 golds)</p>
                    <form action="/process_money" method="post">
                        <input type="hidden" name="building" value="house">
                        <button type="submit" class="btn btn-primary">Find Gold!</button>
                    </form>
                </div>
            </div>

            <div class="col-md-3">
                <div class="building-box">
                    <h3>Casino</h3>
                    <p class="text-muted">(earns/takes 0-50 golds)</p>
                    <form action="/process_money" method="post">
                        <input type="hidden" name="building" value="casino">
                        <button type="submit" class="btn btn-primary">Find Gold!</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <h5>Activities:</h5>
            <div class="activities-box">
                <ul class="list-unstyled mb-0">
                    {% for activity in session['activities'] %}
                        <li class="{{ activity['class'] }} fw-semibold mb-1">{{ activity['text'] }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
